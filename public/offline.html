<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E85D04" />
    <title>CritterOps offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f6efe4;
        color: #16120c;
        font-family: "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      p {
        color: #57534e;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        background: #e85d04;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        border-radius: 12px;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CritterOps</h1>
      <p>You are offline. Open the app again when you have a signal — jobs stay on this phone&apos;s last view.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
