services:
  postgres:
    image: postgres:16-alpine
    container_name: critterops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: critterops
      POSTGRES_PASSWORD: critterops
      POSTGRES_DB: critterops
    ports:
      - "5432:5432"
    volumes:
      - critterops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U critterops -d critterops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  critterops_pg:
